<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Case Management{% endblock %}</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body { font-family: 'Roboto', Arial, sans-serif; background-color: var(--bs-body-bg); color: var(--bs-body-color); }
    .card { border-radius: 20px; box-shadow: 0 6px 24px #0001; }
    .btn { border-radius: 24px; }
    .navbar { border-radius: 0 0 20px 20px; }
    .table th, .table td { vertical-align: middle; }
    .material-icons { vertical-align: middle; }
  </style>

  <link rel="icon" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD..." type="image/x-icon">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4 px-3">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'case-list' %}">
      <span class="material-icons text-primary" style="font-size:2rem;">dashboard</span>
      <span class="ms-2 fw-bold">Case Management</span>
    </a>

    <div class="ms-auto d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="me-3">Hi, {{ user.get_full_name|default:user.username }}</span>
        <a href="{% url 'candidate_list' %}" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#busyModal">Busy</a>
        <a href="{% url 'candidate_list' %}" class="btn btn-outline-primary btn-sm">My Candidates</a>
        <a href="{% url 'ph_list' %}" class="btn btn-outline-success btn-sm">My POs</a>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
      {% else %}
        <img src="https://vizva-uqlv.vercel.app/_next/image?url=%2Fimages%2Flogo.png&w=1920&q=75"
             alt="Vizva"
             style="height:48px; width:180px; object-fit:contain; background:white; border-radius:8px; padding:2px 8px;" />
      {% endif %}

      <!-- Theme Toggle -->
      <button id="theme-toggle" class="btn btn-outline-secondary btn-sm ms-2" title="Toggle light/dark">
        <span class="material-icons align-middle" id="theme-icon">dark_mode</span>
      </button>
    </div>
  </nav>

  <!-- Container -->
  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} shadow-sm">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Theme Toggle Script -->
  <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');

    // Load saved theme or detect system preference
    const savedTheme = localStorage.getItem('bsTheme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = savedTheme || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-bs-theme', theme);
    icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';

    // Toggle on click
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-bs-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('bsTheme', next);
      icon.textContent = next === 'dark' ? 'light_mode' : 'dark_mode';
    });
  </script>
</body>
</html>
