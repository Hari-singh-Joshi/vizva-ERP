<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Case Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Design Google Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      body { font-family: 'Roboto', Arial, sans-serif; background: #f6f8fa; }
      .card { border-radius: 20px; box-shadow: 0 6px 24px #0001; }
      .form-label { font-weight: 500; }
      .btn { border-radius: 24px; }
      .navbar { border-radius: 0 0 20px 20px; }
      .table th, .table td { vertical-align: middle; }
      .material-icons { vertical-align: middle; }
    </style>
    <link rel="icon" href="https://vizva-uqlv.vercel.app/_next/image?url=%2Fimages%2Flogo.png&w=1920&q=75" type="image/x-icon">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 px-3">
  <a class="navbar-brand" href="{% url 'case-list' %}">
    <span class="material-icons text-primary" style="font-size:2rem;">dashboard</span>
    <span class="ms-2 fw-bold">Case Management</span>
  </a>
  <div class="ms-auto d-flex align-items-center gap-2">
    {% if user.is_authenticated %}

      <span class="me-3">Hi, {{ user.get_full_name|default:user.username }}</span>
      <a href="{% url 'ph_list' %}" class="btn btn-outline-success me-2 btn-sm">My PO Entries</a>
      <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
    {% else %}
      <span>
        <img src="https://vizva-uqlv.vercel.app/_next/image?url=%2Fimages%2Flogo.png&w=1920&q=75"
             alt="Vizva"
             style="height:48px; width:180px; object-fit:contain; background:white; border-radius:8px; padding:2px 8px;" />
      </span>
    {% endif %}
  </div>
</nav>

<div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} shadow-sm">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
